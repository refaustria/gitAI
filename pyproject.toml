[project]
name = "gitai"
version = "0.0.1"
description = "Small-scale language model research: a transformer from scratch, and a bounded self-improvement loop"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    # Unicode property classes (\p{L}) for BPE pre-tokenization; stdlib `re`
    # has no equivalent. Still no deep-learning framework in the base install.
    "regex>=2024.0",
]

[project.optional-dependencies]
# Installed later, in Phase 1. Phase 0 deliberately depends on numpy alone:
# the autograd engine must not be able to lean on torch.
train = [
    "torch>=2.4",
    "safetensors>=0.4",
    "pyyaml>=6.0",
]
data = [
    "duckdb>=1.0",
    "pyarrow>=16.0",
]
hf = [
    "tokenizers>=0.20",   # reference implementation, used only to validate ours
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gitai"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
    "E741",   # ambiguous names: `l`, `I` are idiomatic in ML maths
    "N803",   # argument name should be lowercase: `X` for a design matrix
    "N806",   # variable in function should be lowercase: `W`, `Q`, `K`, `V`
    "N812",   # `functional as F` is the universal convention in this field
    "N818",   # PathViolation reads better than PathViolationError
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"src/gitai/autograd/tensor.py" = ["N802"]   # `.T` for transpose, as numpy and torch spell it
"scripts/*" = ["E402"]                      # sys.path shim must precede the gitai import

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: takes more than a few seconds (deselect with '-m \"not slow\"')",
]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = "warning"
